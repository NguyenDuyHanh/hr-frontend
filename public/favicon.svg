<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="40%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="favRibbon" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <filter id="favGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card 512x512 -->
  <rect width="512" height="512" rx="120" fill="url(#favBg)" />
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#favBorder)" stroke-width="4" />

  <!-- Perfectly Centered Iconography Group at Center (256, 256) -->
  <g transform="translate(22, 157)">
    <!-- Back Arc -->
    <path d="M 58 78 C 85 56 180 42 280 45 C 355 48 395 60 415 72 C 400 64 340 50 270 48 C 170 45 80 58 58 78 Z" fill="#0284C7" opacity="0.45" />

    <!-- Letter H -->
    <path d="M 55 35 V 165 M 125 35 V 165 M 55 100 H 125" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Letter R -->
    <path d="M 175 35 V 165 M 175 35 H 220 C 260 35 260 100 220 100 H 175 M 210 100 L 255 165" stroke="#E0F2FE" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Letter M -->
    <path d="M 305 165 V 35 L 345 100 L 385 35 V 165" stroke="#93C5FD" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Front Ribbon -->
    <path d="M 32 88 C 60 110 140 124 230 122 C 330 120 405 100 430 80 C 436 76 436 70 425 71 C 395 90 315 108 225 109 C 135 110 60 98 32 88 Z" fill="url(#favRibbon)" filter="url(#favGlow)" />

    <!-- Satellite Nodes -->
    <line x1="92" y1="52" x2="72" y2="34" stroke="#22D3EE" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="66" cy="28" r="8" fill="#38BDF8" filter="url(#favGlow)" />
    <circle cx="66" cy="28" r="4" fill="#FFFFFF" />

    <line x1="345" y1="124" x2="365" y2="144" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="371" cy="150" r="8" fill="#38BDF8" filter="url(#favGlow)" />
    <circle cx="371" cy="150" r="4" fill="#FFFFFF" />
  </g>
</svg>

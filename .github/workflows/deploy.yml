name: Deploy HRM Frontend

on:
  push:
    branches:
      - develop
  # Allow manual trigger
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # - name: Run lint
      #   run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            
            # Navigate to the project directory on VPS
            cd /opt/apps/hrm/hr-frontend
            
            # Pull and checkout develop branch cleanly
            git fetch origin
            git checkout -f develop
            git reset --hard origin/develop
            
            # Refresh Docker container
            cd /opt/apps/hrm
            docker compose up -d --build --force-recreate --no-deps frontend
            
            # Clean up old images
            docker image prune -f
